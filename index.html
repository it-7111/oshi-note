<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a21caf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="推し活">
  <title>推し活ノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">推し活</h1>
    <button id="sync-status" class="sync" type="button" aria-label="同期状態"></button>
  </header>
  <nav id="chips" class="chips" aria-label="推しの絞り込み"></nav>
  <main id="main"></main>
  <button id="fab" class="fab" type="button" aria-label="追加" hidden>＋</button>
  <nav class="tabbar" aria-label="タブ">
    <button type="button" data-tab="home"><span class="ti">🏠</span>ホーム</button>
    <button type="button" data-tab="calendar"><span class="ti">📅</span>カレンダー</button>
    <button type="button" data-tab="goods"><span class="ti">🎁</span>グッズ</button>
    <button type="button" data-tab="lives"><span class="ti">🎤</span>参戦</button>
    <button type="button" data-tab="money"><span class="ti">💰</span>お金</button>
    <button type="button" data-tab="settings"><span class="ti">⚙️</span>その他</button>
  </nav>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
